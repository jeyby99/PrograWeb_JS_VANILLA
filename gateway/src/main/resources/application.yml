# API Gateway routes + load balancer ("good balancer": health check + retry).
# The backend runs as three instances (BACKEND_1_URL..BACKEND_3_URL): http://app1:8081,
# http://app2:8082 and http://app3:8083 in docker compose, localhost:8081-8083 when run by hand.
# The "bad-balancer" profile (application-bad-balancer.yml) turns the protections off for the demo.
server:
  port: 8080

spring:
  application:
    name: prograweb-gateway
  cloud:
    # Static list of backend instances (no service registry needed)
    discovery:
      client:
        simple:
          instances:
            prograweb-backend:
              - uri: ${BACKEND_1_URL:http://localhost:8081}
              - uri: ${BACKEND_2_URL:http://localhost:8082}
              - uri: ${BACKEND_3_URL:http://localhost:8083}
    loadbalancer:
      # Round robin (default) over the instances that pass the health check
      configurations: health-check
      health-check:
        interval: 5s
        path:
          # The backend has no actuator: its REST API answers 200 when it and PostgreSQL are up
          prograweb-backend: /api/entidades
    gateway:
      server:
        webflux:
          # A backend that does not answer in time is a failure (504), not an endless wait
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          default-filters:
            # Marks every response that went through the gateway
            - AddResponseHeader=X-Gateway, prograweb-gateway
            # Which balancer configuration answered: "good" (this file) or "bad" (bad-balancer profile)
            - AddResponseHeader=X-Balancer, ${prograweb.balancer-mode:good}
            # The backend also sends CORS headers; keep a single copy (browsers reject duplicates)
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowedOrigins: "*"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
          routes:
            # REST API of the backend (Page 1 and any external client), load balanced
            - id: backend-api
              uri: lb://prograweb-backend
              predicates:
                - Path=/api/**
              filters:
                # The backend sees the public host, not "app1:8080" (matters for absolute URLs)
                - PreserveHostHeader
                # If the chosen instance fails, a GET is retried once on the next instance
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: SERVER_ERROR
            # External Rick and Morty API through the gateway:
            # /rickandmorty/character/?name=rick -> https://rickandmortyapi.com/api/character/?name=rick
            - id: rick-and-morty
              uri: https://rickandmortyapi.com
              predicates:
                - Path=/rickandmorty/**
              filters:
                - RewritePath=/rickandmorty/?(?<segment>.*), /api/$\{segment}
            # Everything else (CRUD views, static pages): the backend, load balanced. Last route.
            - id: backend-web
              uri: lb://prograweb-backend
              order: 1000
              predicates:
                - Path=/**
              filters:
                # Without it, the CRUD form redirects (302) to http://app1:8080/..., unreachable from a browser
                - PreserveHostHeader
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: SERVER_ERROR

management:
  endpoints:
    web:
      exposure:
        include: health
