<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 2 - Rick and Morty</title>

    <!-- Bootstrap 5: container, input-group and button -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind: utility classes (shadow, rounding). Preflight disabled so it does not clash with Bootstrap -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>if (window.tailwind) { tailwind.config = { corePlugins: { preflight: false } }; }</script>

    <!-- jQuery: every HTTP request uses $.ajax -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        :root { --azul: #1a6b8c; }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            padding: 24px 16px 40px;
        }

        .page { max-width: 900px; margin: 0 auto; }

        /* Flexbox: search bar */
        .search-container {
            background: var(--azul);
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .search-container form { width: 100%; }
        /* Own Flexbox: the bar still looks right if the Bootstrap CDN fails to load */
        .search-container .input-group { display: flex; width: 100%; }
        .search-container .form-control { flex: 1 1 auto; width: 1%; min-width: 0; padding: 10px; border-radius: 0; font-size: 16px; }
        .search-container .btn { flex: 0 0 auto; padding: 10px 16px; border-radius: 0; cursor: pointer; }

        /* Status messages (waiting, loading, validation, error) */
        #statusMessage {
            min-height: 24px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: bold;
            color: #555;
        }
        #statusMessage[data-state="waiting"],
        #statusMessage[data-state="invalid"],
        #statusMessage[data-state="error"] { color: #d9534f; }
        #statusMessage[data-state="partial"] { color: #b26a00; }
        #statusMessage[data-state="ok"] { color: #198754; }

        /* CSS Grid: 3 columns, as in the mockup */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        /* Flexbox: content of each card */
        .card-item {
            background: var(--azul);
            color: #fff;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 0;
            min-height: 100px;
            overflow: hidden;
        }
        .card-item p { margin: 0; word-break: break-word; }
        .card-item .name { font-size: 17px; font-weight: bold; }
        .card-item .meta { font-size: 13px; opacity: .95; }
        .card-item img {
            width: 96px;
            height: 96px;
            object-fit: cover;
            margin-top: 6px;
            border: 1px solid #fff;
            background: #fff;
        }
        .placeholder-card p { font-size: 16px; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 10px;
            color: #555;
        }

        /* Media queries: 3 columns on desktop, 2 on tablet, 1 on mobile */
        @media (max-width: 991.98px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 20px; }
        }
        @media (max-width: 575.98px) {
            body { padding: 16px 10px 30px; }
            .search-container { padding: 14px; }
            .grid-container { grid-template-columns: 1fr; gap: 14px; }
        }
    </style>
</head>
<body>
<div class="page">

    <!-- Search bar -->
    <div class="search-container">
        <form id="searchForm" novalidate>
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" autocomplete="off"
                       aria-label="Buscar personaje" aria-describedby="statusMessage"
                       placeholder="Barra de busqueda (ej: rick, morty temporada 4, morty cap 2, S04E02)">
                <button id="btnBuscar" class="btn btn-light" type="submit">Buscar</button>
            </div>
        </form>
    </div>

    <div id="statusMessage" role="status" aria-live="polite" data-state="idle"></div>

    <!-- Results grid -->
    <div id="resultadosGrid" class="grid-container"></div>
</div>

<script>
if (!window.jQuery) {
    document.getElementById('statusMessage').textContent =
        'No se pudo cargar jQuery. Revisa tu conexión a internet y recarga la página.';
} else {
(function ($) {
    'use strict';

    /* ---------------- Configuration ---------------- */
    const API_BASE = 'https://rickandmortyapi.com/api';
    const IMG_HOST = 'https://rickandmortyapi.com/';   // only images from this origin are accepted
    const DEBOUNCE_MS = 4000;                          // 4-second wait
    const MAX_CARDS = 6;                               // 3 columns x 2 rows
    const DEFAULT_QUERY = 'rick';                      // initial search
    const MIN_LEN = 2;
    const MAX_LEN = 30;
    const NAME_RE = /^[\p{L}\p{N} .'\-]+$/u;           // letters, digits, space, dot, apostrophe, hyphen
    const TIMEOUT_MS = 10000;
    const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#e6eef2"/>' +
        '<text x="48" y="54" font-size="16" text-anchor="middle" fill="#1a6b8c" font-family="Arial">IMG</text></svg>');

    const $form = $('#searchForm');
    const $input = $('#searchInput');
    const $grid = $('#resultadosGrid');
    const $status = $('#statusMessage');

    let debounceId = null;
    let countdownId = null;
    let searchSeq = 0;      // id of the current search (stale responses are dropped)
    let inflight = [];      // $.ajax requests in flight

    /* ---------------- On-screen status ---------------- */
    function setStatus(state, text) {
        $status.attr({ 'data-state': state, role: state === 'error' || state === 'invalid' ? 'alert' : 'status' })
               .text(text);
    }

    function renderPlaceholders() {
        $grid.empty();
        for (let i = 0; i < MAX_CARDS; i++) {
            $('<div class="card-item placeholder-card" aria-hidden="true"></div>')
                .append($('<p></p>').text('Descripcion ,'))
                .append($('<p></p>').text('Imagen'))
                .appendTo($grid);
        }
    }

    function renderEmpty(text) {
        $grid.empty().append($('<p class="empty-state" data-testid="empty-state"></p>').text(text));
    }

    /* ---------------- Input validation (before sending the request) ---------------- */
    function validateQuery(raw) {
        const value = String(raw || '').trim().replace(/\s+/g, ' ');
        if (value.length < MIN_LEN) return { ok: false, error: 'Escribe al menos ' + MIN_LEN + ' caracteres.' };
        if (value.length > MAX_LEN) return { ok: false, error: 'Máximo ' + MAX_LEN + ' caracteres.' };
        if (!NAME_RE.test(value)) {
            return { ok: false, error: 'Solo se permiten letras, números, espacios, punto, apóstrofe y guion.' };
        }
        const parsed = parseQuery(value);
        if (!parsed.ok) return { ok: false, error: parsed.error };
        return { ok: true, value: value };
    }

    /* ---------------- Query parsing: name + optional season / episode ----------------
       The /episode endpoint filters by episode code and accepts partial codes:
       "S04" = whole season 4, "E04" = episode 4 of every season, "S04E02" = one episode.
       Examples: "morty temporada 4" -> {name: "morty", code: "S04"}
                 "morty cap 4"       -> {name: "morty", code: "E04"}
                 "morty T4 cap 2"    -> {name: "morty", code: "S04E02"} */
    const CODE_RE = /\bs\s*(\d{1,2})\s*e\s*(\d{1,2})\b/;
    const SEASON_RE = /\b(?:temporada|temp|season|t|s)\s*(\d{1,2})\b/;
    const EPISODE_RE = /\b(?:capitulo|cap|episodio|episode|ep|e)\s*(\d{1,2})\b/;
    const FILLER_RE = /\b(?:de|del|la|el|en|y|in|of|the|and|from)\b/g;

    // Lower case without accents, so "Capítulo" and "capitulo" match the same way.
    const normalize = function (s) {
        return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    };
    const pad2 = function (n) { return String(Number(n)).padStart(2, '0'); };

    function parseQuery(value) {
        let rest = ' ' + normalize(value) + ' ';
        let season = null;
        let episode = null;

        let m = CODE_RE.exec(rest);
        if (m) { season = m[1]; episode = m[2]; rest = rest.replace(m[0], ' '); }
        if (season === null && (m = SEASON_RE.exec(rest))) { season = m[1]; rest = rest.replace(m[0], ' '); }
        if (episode === null && (m = EPISODE_RE.exec(rest))) { episode = m[1]; rest = rest.replace(m[0], ' '); }

        if ((season !== null && Number(season) < 1) || (episode !== null && Number(episode) < 1)) {
            return { ok: false, error: 'La temporada y el capítulo deben ser mayores que 0.' };
        }
        if (season === null && episode === null) return { ok: true, name: value, code: null };

        const code = (season !== null ? 'S' + pad2(season) : '') + (episode !== null ? 'E' + pad2(episode) : '');
        const name = rest.replace(FILLER_RE, ' ').replace(/\s+/g, ' ').trim();
        return { ok: true, name: name, code: code };
    }

    function markInvalid(isInvalid) {
        $input.toggleClass('is-invalid', isInvalid).attr('aria-invalid', isInvalid ? 'true' : 'false');
    }

    /* ---------------- Request layer (jQuery) ---------------- */
    function ajaxJSON(url) {
        const xhr = $.ajax({ url: url, method: 'GET', dataType: 'json', timeout: TIMEOUT_MS });
        inflight.push(xhr);
        return xhr;
    }

    function abortInflight() {
        inflight.forEach(function (xhr) { if (xhr.readyState !== 4) xhr.abort(); });
        inflight = [];
    }

    const toArray = function (data) { return Array.isArray(data) ? data : [data]; };

    // Always returns a promise that resolves to {ok, data}, so a partial failure does not break everything.
    function settle(promise) {
        return promise.then(
            function (data) { return { ok: true, data: data }; },
            function () { return { ok: false, data: [] }; }
        );
    }

    // Endpoint 1: /character/?name=...
    function fetchCharacters(name) {
        return ajaxJSON(API_BASE + '/character/?name=' + encodeURIComponent(name));
    }

    // Endpoint 3 used as a filter: /episode/?episode=S04 (season), E04 (episode number) or S04E02
    function fetchEpisodesByCode(code) {
        return ajaxJSON(API_BASE + '/episode/?episode=' + encodeURIComponent(code));
    }

    // Batches: /character/{ids}, /location/{ids} and /episode/{ids} (several ids in one request)
    function fetchBatch(kind, ids) {
        if (!ids.length) return $.Deferred().resolve([]).promise();
        return ajaxJSON(API_BASE + '/' + kind + '/' + ids.join(',')).then(toArray);
    }

    /* ---------------- Response validation ---------------- */
    function idFromUrl(url) {
        const m = /\/(\d+)\/?$/.exec(typeof url === 'string' ? url : '');
        return m ? Number(m[1]) : null;
    }

    function uniq(list) {
        return Array.from(new Set(list.filter(function (x) { return x !== null; })));
    }

    function indexById(list) {
        const map = {};
        list.forEach(function (item) {
            if (item && Number.isInteger(item.id)) map[item.id] = item;
        });
        return map;
    }

    function validateCharacters(data) {
        if (!data || !Array.isArray(data.results)) throw new Error('Respuesta inválida: falta "results"');
        return data.results.filter(function (c) {
            return c && Number.isInteger(c.id) && typeof c.name === 'string';
        });
    }

    function validateEpisodes(data) {
        if (!data || !Array.isArray(data.results)) throw new Error('Respuesta inválida: falta "results"');
        return data.results.filter(function (e) {
            return e && Number.isInteger(e.id) && typeof e.episode === 'string' && Array.isArray(e.characters);
        });
    }

    const locIdOf = function (c) { return idFromUrl(c.location && c.location.url); };
    const epIdOf = function (c) { return idFromUrl(Array.isArray(c.episode) ? c.episode[0] : null); };

    /* ---------------- Chained requests ----------------
       1) /character      -> gets the characters
       2) with that data  -> /location/{ids} and /episode/{ids} in parallel
       3) the 3 responses are combined into one card per character */
    function buscarPersonajes(name, seq) {
        return fetchCharacters(name).then(function (data) {
            const chars = validateCharacters(data).slice(0, MAX_CARDS);
            if (seq !== searchSeq) return $.Deferred().reject({ stale: true }).promise();

            const locIds = uniq(chars.map(locIdOf));
            const epIds = uniq(chars.map(epIdOf));

            return $.when(
                settle(fetchBatch('location', locIds)),
                settle(fetchBatch('episode', epIds))
            ).then(function (locRes, epRes) {
                const episodes = indexById(epRes.data);
                return {
                    chars: chars,
                    locations: indexById(locRes.data),
                    episodeLabel: 'Primer episodio',
                    episodeFor: function (c) { return episodes[epIdOf(c)]; },
                    partial: !locRes.ok || !epRes.ok
                };
            });
        });
    }

    /* ---------------- Chained requests with a season / episode filter ----------------
       1) /episode?episode=CODE -> matching episodes and the ids of their characters
       2) /character/{ids}      -> those characters, filtered by name on the client
       3) /location/{ids}       -> location details for the cards shown
       The card shows the first matching episode the character appears in. */
    function buscarPorEpisodio(name, code, seq) {
        return fetchEpisodesByCode(code).then(function (data) {
            const episodes = validateEpisodes(data);
            if (seq !== searchSeq) return $.Deferred().reject({ stale: true }).promise();

            const matchOf = {};          // character id -> first matching episode
            episodes.forEach(function (ep) {
                ep.characters.forEach(function (url) {
                    const id = idFromUrl(url);
                    if (id !== null && !matchOf[id]) matchOf[id] = ep;
                });
            });

            return fetchBatch('character', Object.keys(matchOf).map(Number)).then(function (list) {
                if (seq !== searchSeq) return $.Deferred().reject({ stale: true }).promise();
                const wanted = normalize(name);
                const chars = validateCharacters({ results: list })
                    .filter(function (c) { return normalize(c.name).indexOf(wanted) !== -1; })
                    .slice(0, MAX_CARDS);

                return settle(fetchBatch('location', uniq(chars.map(locIdOf)))).then(function (locRes) {
                    return {
                        chars: chars,
                        locations: indexById(locRes.data),
                        episodeLabel: 'Episodio',
                        episodeFor: function (c) { return matchOf[c.id]; },
                        partial: !locRes.ok
                    };
                });
            });
        });
    }

    /* ---------------- Render cards (using .text(): no HTML injection risk) ---------------- */
    function buildCard(c, result) {
        const loc = result.locations[locIdOf(c)];
        const ep = result.episodeFor(c);
        const $card = $('<article class="card-item shadow-md" data-testid="character-card"></article>');

        $('<p class="name"></p>').text(c.name).appendTo($card);
        $('<p class="meta"></p>').text((c.species || 'Desconocido') + ' · ' + (c.status || 'unknown')).appendTo($card);

        const locName = loc ? loc.name : (c.location && c.location.name) || 'Desconocida';
        $('<p class="meta"></p>').text('Ubicación: ' + locName + (loc && loc.type ? ' (' + loc.type + ')' : '')).appendTo($card);
        if (loc && loc.dimension && loc.dimension !== 'unknown') {
            $('<p class="meta"></p>').text('Dimensión: ' + loc.dimension).appendTo($card);
        }
        $('<p class="meta"></p>')
            .text(result.episodeLabel + ': ' + (ep ? ep.episode + ' - ' + ep.name : 'No disponible'))
            .appendTo($card);

        const src = typeof c.image === 'string' && c.image.indexOf(IMG_HOST) === 0 ? c.image : FALLBACK_IMG;
        $('<img>').attr({ src: src, alt: c.name, loading: 'lazy' })
            .on('error', function () { $(this).off('error').attr('src', FALLBACK_IMG); })
            .appendTo($card);

        return $card;
    }

    function renderCards(result) {
        $grid.empty();
        result.chars.forEach(function (c) {
            $grid.append(buildCard(c, result));
        });
    }

    /* ---------------- Run a search ---------------- */
    function runSearch(query) {
        abortInflight();
        const seq = ++searchSeq;
        setStatus('loading', '🔎 Buscando "' + query + '"...');

        const parsed = parseQuery(query);
        const search = parsed.code
            ? buscarPorEpisodio(parsed.name, parsed.code, seq)
            : buscarPersonajes(parsed.name, seq);

        search
            .then(function (result) {
                if (seq !== searchSeq) return;
                if (!result.chars.length) {
                    setStatus('empty', 'No se encontraron resultados para "' + query + '".');
                    renderEmpty('Sin resultados. Prueba con otro nombre.');
                    return;
                }
                renderCards(result);
                if (result.partial) {
                    setStatus('partial', '⚠️ Algunos detalles (ubicación o episodio) no están disponibles.');
                } else {
                    setStatus('ok', '✅ ' + result.chars.length + ' resultado(s) para "' + query + '".');
                }
            })
            .catch(function (a, b) {
                if (seq !== searchSeq) return;
                if (a && a.stale) return;
                if (b === 'abort') return;
                if (a && a.status === 404) {          // the API answers 404 when nothing matches
                    setStatus('empty', 'No se encontraron resultados para "' + query + '".');
                    renderEmpty('Sin resultados. Prueba con otro nombre.');
                    return;
                }
                let msg = '⚠️ La respuesta de la API no es válida.';
                if (b === 'timeout') msg = '⌛ La API tardó demasiado en responder. Intenta de nuevo.';
                else if (a && a.status === 429) msg = '🚦 Demasiadas peticiones a la API. Espera un momento.';
                else if (a && a.status >= 500) msg = '❌ La API tuvo un problema (error ' + a.status + ').';
                else if (a && a.status === 0) msg = '📡 Sin conexión con la API.';
                setStatus('error', msg);
                renderEmpty('No se pudieron cargar los personajes.');
            });
    }

    /* ---------------- 4-second debounce ---------------- */
    function clearTimers() {
        clearTimeout(debounceId);
        clearInterval(countdownId);
        debounceId = countdownId = null;
    }

    function startDebounce(query) {
        let restante = DEBOUNCE_MS / 1000;
        const pintar = function () {
            setStatus('waiting', '⏳ Buscando en ' + restante + ' s (debounce)... o presiona Enter');
        };
        pintar();
        countdownId = setInterval(function () {
            restante--;
            if (restante > 0) pintar(); else clearInterval(countdownId);
        }, 1000);
        debounceId = setTimeout(function () {
            clearInterval(countdownId);
            runSearch(query);
        }, DEBOUNCE_MS);
    }

    // On typing: validate and, if valid, wait 4 s without typing before searching
    $input.on('input', function () {
        clearTimers();
        const raw = $input.val();

        if (raw.trim() === '') {                     // empty field: restore the initial results
            markInvalid(false);
            runSearch(DEFAULT_QUERY);
            return;
        }
        const check = validateQuery(raw);
        if (!check.ok) {
            markInvalid(true);
            abortInflight();
            setStatus('invalid', '🚫 ' + check.error);
            return;
        }
        markInvalid(false);
        startDebounce(check.value);
    });

    // Enter or the Search button: search without waiting
    $form.on('submit', function (e) {
        e.preventDefault();
        clearTimers();
        const raw = $input.val();
        if (raw.trim() === '') {
            markInvalid(false);
            runSearch(DEFAULT_QUERY);
            return;
        }
        const check = validateQuery(raw);
        if (!check.ok) {
            markInvalid(true);
            setStatus('invalid', '🚫 ' + check.error);
            return;
        }
        markInvalid(false);
        runSearch(check.value);
    });

    /* ---------------- Startup: show Ricks when the page opens ---------------- */
    $(function () {
        renderPlaceholders();
        runSearch(DEFAULT_QUERY);
    });
})(window.jQuery);
}
</script>
</body>
</html>
