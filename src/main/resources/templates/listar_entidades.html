<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Entidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Lista de Registros</h2>
    
    <!-- Top navigation buttons -->
    <div class="mb-3">
        <a th:href="@{/entidades/nueva}" class="btn btn-primary">Añadir Nuevo</a>
        <!-- Button to go back to the index -->
        <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entidad : ${entidades}">
                <td th:text="${entidad.nombre}"></td>
                <td th:text="${entidad.apellido}"></td>
                <td th:text="${entidad.email}"></td>
                <td>
                    <a th:href="@{/entidades/editar/{id}(id=${entidad.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/entidades/eliminar/{id}(id=${entidad.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
