<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nueva Entidad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Registrar Nueva Entidad</h2>
    <form th:action="@{/entidades}" th:object="${entidad}" method="POST" class="mt-3">
        <div class="mb-3">
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label>Apellido:</label>
            <input type="text" th:field="*{apellido}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label>Email:</label>
            <input type="email" th:field="*{email}" class="form-control" required/>
        </div>
        
        <button type="submit" class="btn btn-success">Guardar</button>
        <!-- Back to the list -->
        <a th:href="@{/entidades}" class="btn btn-secondary">Cancelar</a>
        <!-- Back to the index -->
        <a th:href="@{/}" class="btn btn-dark">Volver al Inicio</a>
    </form>
</div>
</body>
</html>
