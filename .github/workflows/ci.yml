# CI: builds the backend and runs the Playwright e2e tests on every
# push / pull request that targets the dev -> test -> main flow.
name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

jobs:
  backend:
    name: Backend build (Maven, Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: mvn -B clean package -DskipTests
      - name: Build and test the API Gateway
        run: mvn -B -f gateway/pom.xml clean verify

  e2e:
    name: E2E tests (Playwright, page 2)
    runs-on: ubuntu-latest
    # Official image matching the pinned @playwright/test version: browsers and
    # OS deps are preinstalled (newer runner images may not be supported yet).
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build gateway image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
