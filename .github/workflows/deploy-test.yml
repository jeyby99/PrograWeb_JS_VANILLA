# Deploys an image of PrograWeb to the AWS EC2 test server (epic SCRUM-14).
#
# - Called by docker-publish.yml right after the image for the test branch is
#   published (it is a reusable workflow, so it also works before reaching main).
# - Manual run ("Run workflow") deploys any tag, e.g. to redeploy after the
#   AWS Academy lab was off. Re-running a failed job does the same.
#
#   deploy   -> copy files, deploy, health check; rolls back if unhealthy
#   smoke    -> Playwright suite against the deployed server
#   rollback -> only if the smoke tests fail: restore the previous image
#
# Uses SSH with the EC2 key pair instead of AWS credentials: Learner Lab keys
# expire every ~4 hours. Configuration lives in the GitHub "test" environment:
#   variables: EC2_HOST (Elastic IP), EC2_USER (default ec2-user),
#              DB_USERNAME (default postgres), EC2_HOST_KEY (optional, pins the SSH host key)
#   secrets:   EC2_SSH_KEY (contents of the .pem file), DB_PASSWORD
name: Deploy to test (AWS EC2)

on:
  workflow_call:
    inputs:
      image-tag:
        description: Image tag to deploy (e.g. test-sha-1a2b3c4)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to deploy (e.g. test-sha-1a2b3c4)
        type: string
        required: true
        default: test

permissions:
  contents: read

env:
  APP_DIR: /opt/prograweb
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deployment at a time; a newer one waits instead of cancelling the running one
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    environment:
      name: test
      url: http://${{ vars.EC2_HOST }}:8080
    outputs:
      app-url: http://${{ vars.EC2_HOST }}:8080
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          HAS_SSH_KEY: ${{ secrets.EC2_SSH_KEY != '' }}
          HAS_DB_PASSWORD: ${{ secrets.DB_PASSWORD != '' }}
        run: |
          missing=()
          [ -n "$EC2_HOST" ] || missing+=("variable EC2_HOST")
          [ "$HAS_SSH_KEY" = true ] || missing+=("secret EC2_SSH_KEY")
          [ "$HAS_DB_PASSWORD" = true ] || missing+=("secret DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Test environment not configured::Missing in the GitHub 'test' environment: ${missing[*]}"
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid image tag::$IMAGE_TAG"
            exit 1
          fi

      - name: Set up SSH
        uses: ./.github/actions/ec2-ssh
        with:
          host: ${{ vars.EC2_HOST }}
          user: ${{ vars.EC2_USER || 'ec2-user' }}
          ssh-key: ${{ secrets.EC2_SSH_KEY }}
          host-key: ${{ vars.EC2_HOST_KEY }}

      # SC2029: $APP_DIR and $IMAGE_TAG are meant to expand on the runner (both validated above)
      - name: Copy deployment files
        run: |
          # shellcheck disable=SC2029
          ssh ec2 "mkdir -p $APP_DIR"
          scp deploy/docker-compose.test.yml deploy/deploy.sh "ec2:$APP_DIR/"
          # shellcheck disable=SC2029
          ssh ec2 "chmod +x $APP_DIR/deploy.sh"

      - name: Deploy
        id: deploy
        env:
          DB_USERNAME: ${{ vars.DB_USERNAME || 'postgres' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # shellcheck disable=SC2029
          printf 'DB_USERNAME=%s\nDB_PASSWORD=%s\n' "$DB_USERNAME" "$DB_PASSWORD" \
            | ssh ec2 "APP_DIR=$APP_DIR $APP_DIR/deploy.sh deploy $IMAGE_TAG"

      - name: Health check
        run: deploy/health-check.sh "http://$EC2_HOST:8080" 120

      - name: Roll back (deployment unhealthy)
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error title=Deployment unhealthy::Rolling back to the previous image"
          # shellcheck disable=SC2029
          ssh ec2 "APP_DIR=$APP_DIR $APP_DIR/deploy.sh rollback"
          deploy/health-check.sh "http://$EC2_HOST:8080" 120

      - name: Summary
        if: always()
        run: |
          {
            echo "### Test deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`ghcr.io/jeyby99/prograweb:$IMAGE_TAG\` |"
            echo "| Server | http://$EC2_HOST:8080 |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    # Same image as the CI e2e job: browsers preinstalled for the pinned Playwright
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Playwright against the test server
        env:
          BASE_URL: ${{ needs.deploy.outputs.app-url }}
        run: npx playwright test --grep-invert @live
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: playwright-report/
          retention-days: 7

  rollback:
    needs: [deploy, smoke]
    # Only when the deployment itself was healthy but the smoke tests failed
    if: failure() && needs.deploy.result == 'success' && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    environment:
      name: test
      url: http://${{ vars.EC2_HOST }}:8080
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        uses: ./.github/actions/ec2-ssh
        with:
          host: ${{ vars.EC2_HOST }}
          user: ${{ vars.EC2_USER || 'ec2-user' }}
          ssh-key: ${{ secrets.EC2_SSH_KEY }}
          host-key: ${{ vars.EC2_HOST_KEY }}
      - name: Roll back (smoke tests failed)
        run: |
          echo "::error title=Smoke tests failed::Rolling back to the previous image"
          # shellcheck disable=SC2029
          ssh ec2 "APP_DIR=$APP_DIR $APP_DIR/deploy.sh rollback"
          deploy/health-check.sh "http://$EC2_HOST:8080" 120
